# ============================================================================
# ROTAX 912 S/ULS-CLASS SIMULATION MODEL
# ----------------------------------------------------------------------------
# Unofficial simulation model based on publicly available characteristics of
# the carbureted Rotax 912 S series (EASA TCDS E.121).
#
# Intended for simulation, software testing, and digital twin prototyping.
# ============================================================================

engine:
  model_id: "ROTAX-912S-SIM"
  description: "Unofficial simulation model representing the carbureted Rotax 912 S series / ULS-class four-cylinder horizontally opposed aircraft engine."
  provenance_default: SYNTHETIC
  notes:
    - "Manufacturer: BRP-Rotax; Engine family: Rotax 912 S/ULS-class."
    - "Reference document: EASA Type Certificate Data Sheet E.121, Rotax 912 series."
    - "Architecture: 4-stroke, spark-ignition, horizontally opposed, ram-air cooled cylinders, liquid-cooled cylinder heads, dry-sump forced lubrication."
    - "Integrated reduction gearbox ratio: 2.4286 (propeller RPM = crankshaft RPM / 2.4286)."
    - "Takeoff rating: 73.5 kW (98.6 hp) @ 5800 RPM (5 min limit); Max continuous: 69.0 kW (92.5 hp) @ 5500 RPM."

  geometry:
    cylinders: 4               # OFFICIAL_PUBLIC_DATA
    displacement_l: 1.352      # OFFICIAL_PUBLIC_DATA (bore 84.0 mm, stroke 61.0 mm -> 1352 cm^3)
    compression_ratio: 10.8    # OFFICIAL_PUBLIC_DATA
    bore_mm: 84.0              # OFFICIAL_PUBLIC_DATA
    stroke_mm: 61.0            # OFFICIAL_PUBLIC_DATA
    redline_rpm: 5800          # OFFICIAL_PUBLIC_DATA (takeoff limit)
    idle_rpm: 1400             # USER_CONFIGURED (typical 1400 RPM idle)
    rated_rpm: 5500            # OFFICIAL_PUBLIC_DATA (maximum continuous)
    rated_power_kw: 69.0       # OFFICIAL_PUBLIC_DATA (maximum continuous)

  performance_maps:
    # Fuel flow (BSFC g/kWh) vs (RPM, MAP inHg)
    # Calibrated across Rotax operating range (1400 - 5800 RPM, 45 - 101.3 kPa / 13.29 - 29.92 inHg)
    bsfc_g_per_kwh:
      rpm_axis: [1400, 2500, 3500, 4500, 5500, 5800]
      map_axis: [13.29, 17.72, 22.15, 26.58, 29.92]
      values:
        - [520, 470, 430, 410, 405]
        - [490, 430, 395, 375, 380]
        - [470, 410, 370, 355, 360]
        - [480, 415, 375, 360, 365]
        - [500, 430, 390, 370, 375]
        - [520, 450, 405, 385, 390]

    # Expected EGT (deg C) vs (RPM, MAP inHg)
    egt_map_c:
      rpm_axis: [1400, 2500, 3500, 4500, 5500, 5800]
      map_axis: [13.29, 17.72, 22.15, 26.58, 29.92]
      values:
        - [500, 555, 610, 650, 675]
        - [520, 580, 635, 680, 705]
        - [535, 600, 660, 710, 740]
        - [550, 620, 680, 730, 760]
        - [565, 640, 700, 750, 780]
        - [575, 650, 710, 760, 790]

    # Expected CHT (deg C) vs (RPM, MAP inHg)
    cht_map_c:
      rpm_axis: [1400, 2500, 3500, 4500, 5500, 5800]
      map_axis: [13.29, 17.72, 22.15, 26.58, 29.92]
      values:
        - [90, 100, 110, 120, 125]
        - [95, 108, 120, 130, 135]
        - [100, 115, 128, 138, 142]
        - [105, 120, 133, 143, 147]
        - [110, 125, 138, 148, 152]
        - [112, 128, 141, 150, 155]

  # Throttle -> manifold pressure transfer
  throttle_to_map:
    gain_inhg_per_unit: 1.0
    idle_map_inhg: 11.81       # 40 kPa absolute
    max_map_inhg: 29.92        # 101.3 kPa absolute
    dead_zone: 0.02

  # Rotax rotational and thermal dynamics
  dynamics:
    rpm_time_constant_s: 1.5
    thermal_time_constant_s: 90.0
    oil_time_constant_s: 60.0

  # Official Rotax operating limits (EASA TCDS E.121)
  limits:
    egt_max_c: 850.0           # Typical Rotax 912 operational envelope
    cht_max_c: 135.0           # OFFICIAL_PUBLIC_DATA (liquid-cooled cylinder heads max 135 °C)
    oil_temp_min_c: 50.0       # OFFICIAL_PUBLIC_DATA (minimum operating 50 °C)
    oil_temp_max_c: 130.0      # OFFICIAL_PUBLIC_DATA (maximum operating 130 °C)
    oil_pressure_min_psi: 11.6 # OFFICIAL_PUBLIC_DATA (below 3500 RPM: 0.8 bar / 11.6 psi)
    oil_pressure_max_psi: 101.5 # OFFICIAL_PUBLIC_DATA (cold start max: 7.0 bar / 101.5 psi)
    vibration_rms_max_g: 6.0   # Prototype envelope

  # Rotax 912 dry-sump lubrication
  lubrication:
    oil_capacity_l: 3.0        # OFFICIAL_PUBLIC_DATA (2.5 - 3.0 L dry sump)
    nominal_pressure_psi: 50.0 # Normal cruising pressure (approx 3.5 bar)
    pressure_rpm_slope: 0.005  # Dynamic pressure rise with RPM
    pressure_temp_drop_per_c: 0.05 # Dynamic pressure drop with oil thinning

  # Degradation model
  degradation:
    base_wear_per_hour: 1.0e-5
    wear_temp_factor_per_c: 2.0e-6
    wear_rpm_factor_per_rpm: 1.0e-9
    max_wear: 1.0
