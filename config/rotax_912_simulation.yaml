        [ [420.0, 390.0, 360.0, 350.0, 345.0],
        # 3000 rpm
          [380.0, 340.0, 310.0, 295.0, 290.0],
        # 4500 rpm
          [350.0, 315.0, 285.0, 275.0, 270.0],
        # 5000 rpm
          [340.0, 310.0, 280.0, 270.0, 265.0],
        # 5500 rpm
          [350.0, 320.0, 290.0, 280.0, 278.0],
        # 5800 rpm
          [370.0, 340.0, 310.0, 300.0, 295.0] ]

    egt_map_c:
      description: "Synthetic Exhaust Gas Temperature approximation (°C)"
      rpm_axis: [1400.0, 3000.0, 4500.0, 5000.0, 5500.0, 5800.0]
