# ==============================================================================
# UNOFFICIAL ROTAX 912 ENGINE SIMULATION CONFIGURATION
# ==============================================================================
# SAFETY DISCLAIMER:
# 1. This is an unofficial simulation-only project.
# 2. It is not an official BRP-Rotax product or certified engine model.
# 3. It must not be used for real aircraft operation, flight-critical control,
#    aircraft certification, maintenance release, or real engine limit determination.
# 4. Performance maps (BSFC, EGT, CHT) below are SYNTHETIC numerical approximations
#    and are NOT manufacturer-provided or validated data.
# ==============================================================================

engine:
  model_id: "ROTAX-912S-SIM"
  variant: "Rotax 912 S/ULS (Naturally Aspirated, Carbureted, 100 hp)"
  model_status: "UNOFFICIAL_SIMULATION"
  calibration_status: "SYNTHETIC_RESEARCH_CALIBRATION"
  manufacturer_validation: false
  certification_status: "UNNOTIFIED_NON_CERTIFIED"
  reduction_gear_ratio: 2.4286

  # Official/Public Geometry and Operating Ratings (Published Type Certificate Data Sheet reference)
  geometry:
    displacement_cc: 1352.0
    bore_mm: 84.0
    stroke_mm: 61.0
    compression_ratio: 10.5
    idle_rpm: 1400.0
    rated_rpm: 5500.0        # Max continuous RPM
    redline_rpm: 5800.0      # Max take-off RPM (5 min limit)
    rated_power_kw: 69.0     # 92.5 hp at 5500 rpm
    max_power_kw: 73.5       # 100 hp at 5800 rpm

  throttle_to_map:
    idle_map_inhg: 11.81     # ~400 hPa closed throttle
    max_map_inhg: 29.92      # Ambient standard sea level

  # Published Operating Limits
  limits:
    egt_max_c: 850.0
    cht_max_c: 135.0         # Coolant / CHT max
    oil_temp_max_c: 130.0
    oil_temp_min_c: 50.0
    oil_press_max_psi: 72.5
    oil_press_min_psi: 12.0

  # Synthetic Performance Maps (Interpolated 2D approximations for simulation only)
  performance_maps:
    bsfc_g_per_kwh:
      description: "Synthetic Brake Specific Fuel Consumption approximation (g/kWh)"
      rpm_axis: [1400.0, 3000.0, 4500.0, 5000.0, 5500.0, 5800.0]
      map_axis: [12.0, 18.0, 24.0, 27.0, 29.92]
